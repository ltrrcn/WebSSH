# 飞牛 Docker 版编排（fnOS docker-project 资源规范）
# image 优先从 CNB 制品库拉取（公开仓库匿名可拉，国内网络直连，无需现场构建）；
# 拉取失败时按包内构建上下文（./app）现场构建（基础镜像 node:22-alpine 走 fnnas 镜像源）
services:
  webssh:
    image: docker.cnb.cool/ltrr/webssh:0.7.0
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: webssh-docker
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:8080"
    volumes:
      - "${TRIM_PKGVAR}/webssh:/data"
    environment:
      PUID: "${TRIM_UID:-1000}"
      PGID: "${TRIM_GID:-1000}"
