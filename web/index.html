<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebSSH</title>
  <script>
    // 统一网关下文档 URL 可能为 /app/webssh（无尾斜杠），相对资源会被解析到
    // /app/vendor/... 错误层级。此处强制归一为带尾斜杠，必须在所有相对引用之前执行。
    (function () {
      var p = location.pathname;
      if (p.length > 1 && !/\/$/.test(p)) {
        history.replaceState(null, '', p + '/' + location.search + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="vendor/xterm/xterm.css" />
  <style>
    /* ===== 主题变量（FR-048）：黑色为默认，浅色覆盖；导入配色 = 替换变量集 ===== */
    :root, [data-theme="dark"] {
      --bg: #0e1116;
      --bg-panel: #151922;
      --bg-elevated: #1b2029;
      --bg-hover: #20262f;
      --bg-active: #2a3140;
      --bg-input: #0e1116;
      --term-bg: #0a0c10;
      --border: #262c38;
      --border-strong: #343c4c;
      --text: #e8eaf0;
      --text-dim: #9aa3b2;
      --text-faint: #626c7d;
      --accent: #4f8dff;
      --accent-soft: rgba(79, 141, 255, .14);
      --accent-text: #ffffff;
      --ok: #3ecf8e;
      --ok-soft: rgba(62, 207, 142, .12);
      --warn: #f2b04d;
      --warn-soft: rgba(242, 176, 77, .12);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, .12);
      --tag-bg: #20262f;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }
    [data-theme="light"] {
      --bg: #f4f6f9;
      --bg-panel: #ffffff;
      --bg-elevated: #ffffff;
      --bg-hover: #eef1f6;
      --bg-active: #e3e9f5;
      --bg-input: #ffffff;
      --term-bg: #fcfdff;
      --border: #e3e7ed;
      --border-strong: #ccd3dd;
      --text: #22272f;
      --text-dim: #57606f;
      --text-faint: #8a94a4;
      --accent: #2f6fed;
      --accent-soft: rgba(47, 111, 237, .10);
      --accent-text: #ffffff;
      --ok: #0a8a5f;
      --ok-soft: rgba(10, 138, 95, .10);
      --warn: #b26b00;
      --warn-soft: rgba(178, 107, 0, .10);
      --danger: #d1242f;
      --danger-soft: rgba(209, 36, 47, .08);
      --tag-bg: #eef1f6;
      --shadow-sm: 0 1px 2px rgba(31,42,66,.06);
      --shadow-md: 0 4px 16px rgba(31,42,66,.08);
      --shadow-lg: 0 16px 48px rgba(31,42,66,.14);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    :root { color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg); color: var(--text); overflow: hidden;
    }
    button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button, .host-item, .tab, input, select, textarea, .theme-option, .ctx-item, .seg-btn {
      transition: background-color .15s ease, color .15s ease, border-color .15s ease,
                  box-shadow .15s ease, transform .1s ease;
    }
    button:active { transform: scale(.97); }

    #app { display: flex; height: 100vh; }

    /* ===== 左侧边栏（FR-044） ===== */
    #sidebar {
      width: 264px; min-width: 264px; display: flex; flex-direction: column;
      background: var(--bg-panel); border-right: 1px solid var(--border);
    }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 14px 12px; font-weight: 600; font-size: 14px; letter-spacing: .02em;
    }
    .sidebar-header .brand { display: flex; align-items: center; gap: 9px; }
    .logo {
      display: block; width: 28px; height: 28px; flex: none;
      filter: drop-shadow(0 2px 6px var(--accent-soft));
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-text .name { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
    .brand-text .sub { font-size: 9.5px; font-weight: 500; color: var(--text-faint); letter-spacing: .14em; }
    .sidebar-header .count { font-size: 11px; color: var(--text-faint); font-weight: 400; }
    .sidebar-header-right { display: flex; align-items: center; gap: 6px; }
    #host-list { flex: 1; overflow-y: auto; padding: 2px 10px 10px; }
    /* 竖状树形分组（FR-054 强化）：分区头吸顶置前，组内条目缩进带树形引导线 */
    .side-group { margin-bottom: 2px; }
    .side-group-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 7px 8px 7px 6px; border: none; border-radius: var(--radius-sm);
      background: transparent; color: var(--text-faint); cursor: pointer; user-select: none;
      font-size: 11px; font-weight: 600; letter-spacing: .06em; text-align: left;
    }
    .side-group-head:hover { color: var(--text); background: var(--bg-hover); }
    .group-chevron {
      font-size: 9px; display: inline-block; transition: transform .22s ease;
      transform-origin: center; color: var(--text-faint);
    }
    .side-group.collapsed .group-chevron { transform: rotate(-90deg); }
    .side-group-head .group-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
    .group-count {
      font-size: 10px; color: var(--text-faint);
      background: var(--tag-bg); border-radius: 8px; padding: 1px 7px;
    }
    .side-group.collapsed .group-count { opacity: .7; }
    .group-items {
      display: grid; grid-template-rows: 1fr;
      transition: grid-template-rows .22s ease;
    }
    .side-group.collapsed .group-items { grid-template-rows: 0fr; }
    .group-items-inner { overflow: hidden; min-height: 0; position: relative; padding-left: 10px; }
    .group-items-inner::before {
      content: ''; position: absolute; left: 3px; top: 6px; bottom: 6px;
      width: 1.5px; border-radius: 1px; background: var(--border);
    }
    .side-group.collapsed .group-items-inner::before { display: none; }
    .host-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; margin-bottom: 2px; border-radius: var(--radius-md); border: none;
      background: transparent; color: var(--text); cursor: pointer; text-align: left;
      font-size: 13px; position: relative;
    }
    .host-item::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 0; border-radius: 2px; background: var(--ok);
      transition: height .2s ease;
    }
    .host-item.connected::before { height: 60%; }
    .host-item:hover { background: var(--bg-hover); }
    .host-item .host-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .host-item .host-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .host-item .host-meta {
      font-size: 11px; color: var(--text-dim); font-family: Menlo, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .host-item .host-actions { display: none; gap: 2px; }
    .host-item:hover .host-actions { display: flex; }
    .icon-btn {
      border: none; background: transparent; color: var(--text-dim); cursor: pointer;
      padding: 4px 6px; border-radius: var(--radius-sm); font-size: 12px; line-height: 1;
    }
    .icon-btn:hover { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-sm); }
    .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
    .tag {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      background: var(--tag-bg); color: var(--text-dim);
    }
    .tag.ok { color: var(--ok); background: var(--ok-soft); }
    .tag.warn { color: var(--warn); background: var(--warn-soft); }
    .sidebar-empty {
      color: var(--text-faint); font-size: 12px; text-align: center;
      padding: 40px 16px; line-height: 1.8;
    }
    .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); }
    #btn-settings {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 9px 12px; border-radius: var(--radius-md); border: none; cursor: pointer;
      background: transparent; color: var(--text-dim); font-size: 13px;
    }
    #btn-settings:hover { background: var(--bg-hover); color: var(--text); }

    /* ===== 右侧终端区（FR-044/045） ===== */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    #tabbar {
      display: flex; align-items: stretch; height: 40px; min-height: 40px;
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      overflow-x: auto; padding: 0 4px;
      position: relative; z-index: 2; /* 置于空态遮罩之上，保证「新增」按钮可点击 */
    }
    .tab {
      display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; margin: 6px 2px 0;
      border-radius: var(--radius-md) var(--radius-md) 0 0; cursor: pointer; font-size: 13px;
      color: var(--text-dim); position: relative; white-space: nowrap; user-select: none;
      border: 1px solid transparent; border-bottom: none;
    }
    .tab:hover { color: var(--text); background: var(--bg-hover); }
    .tab.active {
      color: var(--text); background: var(--term-bg);
      border-color: var(--border);
    }
    .tab.active::after {
      content: ''; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px;
      border-radius: 2px; background: var(--accent);
    }
    .tab .tab-status {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--warn);
    }
    .tab .tab-status.open { background: var(--ok); }
    .tab:not(.active) .tab-status:not(.open) {
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }
    .tab .tab-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .tab .tab-close {
      border: none; background: transparent; color: var(--text-faint); cursor: pointer;
      padding: 3px 5px; border-radius: var(--radius-sm); font-size: 12px; line-height: 1;
    }
    .tab .tab-close:hover { background: var(--danger-soft); color: var(--danger); }
    .tab-rename {
      background: var(--bg-input); color: var(--text); border: 1px solid var(--accent);
      border-radius: var(--radius-sm); font-size: 13px; padding: 2px 8px; width: 130px;
      outline: none; box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .tab-rename.conflict { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .tab.new-session {
      justify-content: center; width: 34px; color: var(--text-faint);
      background: transparent; font-size: 15px;
    }
    .tab.new-session:hover { color: var(--accent); background: var(--accent-soft); }
    /* 新建会话主机选择（FR-052） */
    .picker-list { display: flex; flex-direction: column; gap: 6px; }
    .picker-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
      background: var(--bg-input); color: var(--text); cursor: pointer; text-align: left;
    }
    .picker-item:hover { border-color: var(--accent); background: var(--accent-soft); }
    .picker-name { font-weight: 500; }
    .picker-meta { font-size: 11px; color: var(--text-dim); font-family: Menlo, monospace; }
    #terminals { flex: 1; position: relative; background: var(--term-bg); }
    .term-instance { position: absolute; inset: 0; display: none; flex-direction: column; }
    .term-instance.active { display: flex; }
    .term-instance .term-container { flex: 1; padding: 8px 6px 4px 8px; min-height: 0; }
    .term-instance .term-status {
      min-height: 24px; font-size: 12px; color: var(--text-faint);
      padding: 2px 12px 8px; display: none;
    }
    .term-instance .term-status.show { display: block; }
    .term-instance .term-status.err { color: var(--danger); }
    #empty-state {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: 14px; flex-direction: column; gap: 14px;
      animation: fadeIn .3s ease;
    }
    #empty-state .big {
      font-size: 30px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--bg-panel); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    @keyframes fadeIn { from { opacity: 0; } }

    /* ===== 弹窗（入场动画 + 毛玻璃） ===== */
    #modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
    #modal-root.show { display: block; }
    .modal-mask {
      position: absolute; inset: 0; background: rgba(6,8,12,.55);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      animation: fadeIn .15s ease;
    }
    .modal {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px;
      min-width: 440px; max-width: 740px; max-height: 85vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalIn .18s cubic-bezier(.2, .9, .3, 1.2);
    }
    @keyframes modalIn { from { opacity: 0; transform: translate(-50%, -48%) scale(.96); } }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px 2px; font-size: 15px; font-weight: 600; letter-spacing: .01em;
    }
    .modal-head .icon-btn { font-size: 14px; padding: 5px 8px; }
    .modal-body { padding: 12px 20px 20px; }
    /* 设置弹窗：固定尺寸（仅设置，不影响表单等其他弹窗） */
    .modal.settings-modal { width: 960px; height: 620px; display: flex; flex-direction: column; max-width: 95vw; max-height: 90vh; }
    .modal.settings-modal .modal-body { flex: 1; display: flex; overflow: hidden; padding: 16px 20px 20px 12px; }
    .modal.settings-modal .audit-list { max-height: 46vh; }

    /* 表单 */
    form.host-form label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 12px; font-weight: 500; }
    /* hidden 属性优先级必须高于 display:block（FR-050 凭据框条件显示） */
    form.host-form [hidden], .hidden { display: none !important; }
    form.host-form input, form.host-form select, form.host-form textarea {
      display: block; width: 100%; margin-top: 6px;
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; font-size: 13px;
    }
    form.host-form input:focus, form.host-form textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none;
    }
    form.host-form input::placeholder, form.host-form textarea::placeholder { color: var(--text-faint); }
    form.host-form textarea { font-family: Menlo, monospace; font-size: 11px; resize: vertical; }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      background: var(--bg-elevated); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 7px 18px; cursor: pointer; font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-sm);
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.08); box-shadow: 0 4px 14px var(--accent-soft); }
    .btn.danger-text { color: var(--danger); }
    .form-note { font-size: 11px; color: var(--text-faint); margin: 2px 0 0; }
    .icon { display: inline-block; vertical-align: -0.18em; flex: none; }
    button .icon { margin-right: 2px; }

    /* 分段选择器（认证方式，FR-050 美化） */
    .seg {
      display: flex; margin-top: 6px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: var(--radius-md); padding: 3px; gap: 3px;
    }
    .seg-btn {
      flex: 1; border: none; background: transparent; color: var(--text-dim);
      padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.selected {
      background: var(--accent); color: var(--accent-text); font-weight: 500;
      box-shadow: var(--shadow-sm);
    }

    /* 设置弹窗：左侧竖向菜单 + 右侧内容区 */
    .settings-layout { display: flex; flex: 1; min-height: 0; min-width: 0; }
    .settings-nav {
      display: flex; flex-direction: column; flex: none; width: 128px;
      border-right: 1px solid var(--border); padding-right: 4px; margin-right: 4px;
    }
    .settings-nav button {
      border: none; background: transparent; color: var(--text-dim); cursor: pointer;
      padding: 11px 12px; font-size: 13px; text-align: left; border-radius: var(--radius-md);
      border-left: 2px solid transparent; border-top-left-radius: 0; border-bottom-left-radius: 0;
      margin-bottom: 2px;
    }
    .settings-nav button:hover { color: var(--text); background: var(--bg-hover); }
    .settings-nav button.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
    .settings-content { flex: 1; min-width: 0; overflow-y: auto; padding-left: 16px; }
    /* 令牌配置页（与审计/令牌页同款 audit-list/audit-row 结构） */
    .tc-title { font-size: 13px; font-weight: 600; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
    .tc-mono { font-family: Menlo, monospace; font-size: 11.5px; background: var(--bg-hover); border-radius: 4px; padding: 1px 6px; word-break: break-all; }
    .tag.danger { color: var(--danger, #f87171); background: var(--danger-soft, rgba(248,113,113,.12)); }
    /* 通用设置：分节小标题 + 行式偏好控件 */
    .pref-section { margin-bottom: 22px; }
    .pref-title {
      font-size: 12px; font-weight: 600; color: var(--text-faint); letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 10px; padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .pref-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 7px 0; }
    .pref-label { font-size: 13px; }
    .pref-desc { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
    .pref-inline { display: flex; align-items: center; gap: 10px; }
    .pref-inline code { font-family: Menlo, monospace; font-size: 12px; color: var(--text-dim); min-width: 2em; text-align: right; }
    input[type="range"] { accent-color: var(--accent); width: 140px; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span {
      position: absolute; inset: 0; border-radius: 20px;
      background: var(--bg-hover); border: 1px solid var(--border); transition: background .15s ease;
    }
    .switch span::before {
      content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: var(--text-faint); transition: all .15s ease;
    }
    .switch input:checked + span { background: var(--accent); border-color: var(--accent); }
    .switch input:checked + span::before { transform: translateX(16px); background: #fff; }
    .theme-row { display: flex; gap: 12px; }
    .theme-option {
      flex: 1; border: 2px solid var(--border); border-radius: 12px; padding: 14px;
      cursor: pointer; text-align: center; font-size: 13px; color: var(--text-dim);
    }
    .theme-option:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .theme-option.selected { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
    .theme-option .swatch {
      height: 48px; border-radius: 8px; margin-bottom: 10px;
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .swatch.dark { background: linear-gradient(135deg, #0e1116 50%, #1b2029 50%); }
    .swatch.light { background: linear-gradient(135deg, #f4f6f9 50%, #ffffff 50%); }
    .placeholder-box { color: var(--text-faint); font-size: 13px; text-align: center; padding: 36px 0; line-height: 1.7; }

    /* 审计页（US4） */
    /* 审计页：顶部说明 + 四列表格（时间/事件/设备 ID/状态） */
    .audit-note {
      font-size: 12px; color: var(--text-dim); line-height: 1.7;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 10px 14px; margin-bottom: 12px;
    }
    .audit-note b { color: var(--text); font-weight: 600; }
    .audit-table .audit-head, .audit-table .audit-row {
      display: grid; grid-template-columns: 128px 1.25fr 1fr 84px; gap: 12px; align-items: center;
    }
    .audit-table .audit-head {
      padding: 8px 16px; font-size: 11px; color: var(--text-faint); letter-spacing: .05em;
      border-bottom: 1px solid var(--border); background: var(--bg-hover);
      position: sticky; top: 0; z-index: 1;
    }
    .audit-table .audit-row { padding: 10px 16px; }
    .audit-cell-event { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .audit-sub { font-size: 10.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .audit-host-id { font-family: Menlo, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .audit-cell-status { justify-self: start; }
    .audit-toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .audit-toolbar select {
      background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 6px 10px; font-size: 12px;
    }
    .audit-toolbar .btn { padding: 6px 14px; }
    .audit-list {
      border: 1px solid var(--border); border-radius: var(--radius-md);
      background: var(--bg-input); max-height: 46vh; overflow-y: auto;
    }
    .audit-row {
      display: flex; align-items: center; gap: 12px; padding: 13px 16px;
      border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.55;
    }
    .audit-row:last-child { border-bottom: none; }
    .audit-row:hover { background: var(--bg-hover); }
    .audit-time { color: var(--text-faint); font-family: Menlo, monospace; font-size: 11px; white-space: nowrap; }
    .audit-event { font-weight: 500; white-space: nowrap; }
    .audit-host { white-space: nowrap; }
    .audit-addr { color: var(--text-faint); font-family: Menlo, monospace; font-size: 10px; margin-left: 4px; }
    .audit-detail { color: var(--text-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .audit-pager { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .audit-page-info { font-size: 12px; color: var(--text-faint); }
    .audit-pager .btn[disabled] { opacity: .4; cursor: default; }

    /* 令牌页（US6） */
    .onetime-token {
      background: var(--ok-soft); border: 1px solid var(--ok); border-radius: var(--radius-md);
      padding: 12px 14px; margin-bottom: 10px; font-size: 13px; line-height: 1.6;
    }
    .onetime-value {
      font-family: Menlo, monospace; font-size: 12px; word-break: break-all;
      background: var(--bg-input); border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm); padding: 8px 10px; margin: 8px 0;
      user-select: all;
    }
    /* 会话右键菜单（FR-049） */
    .ctx-menu {
      position: fixed; z-index: 300; display: none; min-width: 168px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px;
      padding: 5px; box-shadow: var(--shadow-lg);
      animation: ctxIn .12s ease;
    }
    @keyframes ctxIn { from { opacity: 0; transform: scale(.96) translateY(-2px); } }
    .ctx-menu.show { display: block; }
    .ctx-menu .ctx-meta { font-size: 10px; color: var(--text-faint); padding: 6px 12px 5px; font-family: Menlo, monospace; }
    .ctx-menu .ctx-item {
      display: block; width: 100%; text-align: left; padding: 8px 12px; border: none;
      background: transparent; color: var(--text); font-size: 13px; border-radius: 7px; cursor: pointer;
    }
    .ctx-menu .ctx-item:hover { background: var(--bg-hover); }
    .ctx-menu .ctx-item.danger { color: var(--danger); }
    .ctx-menu .ctx-item.danger:hover { background: var(--danger-soft); }
    .ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 5px 8px; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
