      background: var(--code-btn-bg); color: var(--code-btn-text); border: 1px solid var(--code-btn-border); border-radius: var(--radius-sm);
      padding: 4px 12px; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: background .12s ease;
    }
    .tc-bar-btn:hover { background: var(--code-btn-hover); }
    .tc-bar-link { background: none; border: none; padding: 0; font-size: 11.5px; color: var(--accent); cursor: pointer; transition: opacity .12s ease; }
    .tc-bar-link:hover { opacity: .75; text-decoration: underline; }
    .tc-code-win .tc-conf { border: none; border-radius: 0; box-shadow: none; }
    .tc-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .tc-meta-chip { font-size: 11px; color: var(--text-faint); background: var(--bg-hover); border-radius: 20px; padding: 3px 10px; line-height: 1.6; }
    .tc-conf {
      margin: 0; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: var(--radius-md);
      box-shadow: var(--code-inset);
      padding: 12px 14px; font-family: Menlo, Monaco, 'Courier New', monospace; font-size: 12px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-all; max-height: 34vh; overflow-y: auto; color: var(--code-text);
    }
    /* mcp.json 语法高亮：键名 / 字符串值（随主题配色） */
    .tc-conf .j-key { color: var(--code-key); }
    .tc-conf .j-str { color: var(--code-str); }
    /* 轻量 toast（右下角浮出） */
    .tc-toast-host { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
    .tc-toast {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 9px 14px;
      border-radius: var(--radius-md); background: var(--bg-elevated);
      border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm);
      opacity: 0; transform: translateY(6px); transition: opacity .2s ease, transform .2s ease;
      max-width: 340px;
    }
    .tc-toast.show { opacity: 1; transform: none; }
    .tc-toast .icon { flex: none; }
    .tc-toast.ok .icon { color: var(--ok); }
    .tc-toast.err { border-color: var(--danger, #f87171); }
    .tc-toast.err .icon { color: var(--danger, #f87171); }
    @media (max-width: 720px) {
      .tc-mcp-grid { grid-template-columns: 1fr; }
      .tc-custom-input { max-width: none; }
    }
    /* 令牌表单：快速提示词生成结果 */
    .prompt-gen { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .prompt-gen-head { display: flex; align-items: center; gap: 10px; }
    .audit-pager { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .audit-page-info { font-size: 12px; color: var(--text-faint); }
    .audit-pager .btn[disabled] { opacity: .4; cursor: default; }

    /* 令牌页（US6） */
    .onetime-token {
      background: var(--ok-soft); border: 1px solid var(--ok); border-radius: var(--radius-md);
      padding: 12px 14px; margin-bottom: 10px; font-size: 13px; line-height: 1.6;
    }
    .onetime-value {
      font-family: Menlo, monospace; font-size: 12px; word-break: break-all;
      background: var(--bg-input); border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm); padding: 8px 10px; margin: 8px 0;
      user-select: all;
    }
    .onetime-token .tc-code-win { margin: 10px 0; }
    .onetime-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .onetime-plain { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-faint); flex-wrap: wrap; }
    .onetime-plain .onetime-value { flex: 1; min-width: 200px; margin: 0; }
    /* 2FA验证弹窗：操作按钮右对齐（取消 / 验证） */
    .twofa-card .form-actions { justify-content: flex-end; }
    /* 2FA验证页 */
    .twofa-intro { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 12px; text-align: center; }
    .twofa-intro-icon {
      width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: var(--accent-soft); color: var(--accent); margin-bottom: 4px;
    }
    .twofa-intro-title { margin: 0; font-size: 14px; font-weight: 600; }
    .twofa-intro-desc { margin: 0 0 6px; font-size: 12px; color: var(--text-dim); line-height: 1.8; max-width: 420px; }
    .twofa-intro-desc b { color: var(--text); }
    .twofa-scope { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .twofa-scope-item {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim);
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 7px 14px;
    }
    .twofa-scope-item .icon { color: var(--accent); }
    .twofa-bind { display: flex; gap: 22px; align-items: flex-start; padding: 6px 0; }
    .twofa-qr {
      flex: none; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 8px; box-shadow: var(--shadow-sm);
    }
    .twofa-qr svg { display: block; }
    .twofa-bind-side { flex: 1; min-width: 0; }
    .twofa-step { margin: 0 0 6px; font-size: 12.5px; color: var(--text-dim); }
    .twofa-secret {
      display: block; font-family: Menlo, monospace; font-size: 12px; word-break: break-all;
      background: var(--bg-input); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
      padding: 8px 10px; margin: 4px 0 8px; user-select: all;
    }
    .twofa-copy { padding: 5px 12px; font-size: 12px; margin-bottom: 10px; }
    .twofa-code-input { margin-top: 4px; letter-spacing: .12em; font-size: 15px; font-family: Menlo, monospace; text-align: center; }
    .twofa-err { color: var(--danger); font-size: 12px; min-height: 16px; margin: 6px 0 0; }
    .twofa-locked { color: var(--danger); }
    .twofa-recovery { padding: 4px 0; }
    .twofa-code-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0;
    }
    .twofa-code-grid code {
      font-family: Menlo, monospace; font-size: 13px; text-align: center; user-select: all;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 6px;
    }
    .twofa-card { width: 380px; }
    .twofa-hint { margin: 0 0 10px; font-size: 13px; color: var(--text-dim); }
    .twofa-card .form-actions { margin-top: 14px; }
    .twofa-card .twofa-code-input { font-size: 18px; padding: 9px 10px; }
    .twofa-recovery-input { margin-top: 4px; font-family: Menlo, monospace; font-size: 14px; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
    /* 会话右键菜单（FR-049） */
    .ctx-menu {
      position: fixed; z-index: 300; display: none; min-width: 168px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px;
      padding: 5px; box-shadow: var(--shadow-lg);
      animation: ctxIn .12s ease;
    }
    @keyframes ctxIn { from { opacity: 0; transform: scale(.96) translateY(-2px); } }
    .ctx-menu.show { display: block; }
    .ctx-menu .ctx-meta { font-size: 10px; color: var(--text-faint); padding: 6px 12px 5px; font-family: Menlo, monospace; }
    .ctx-menu .ctx-item {
      display: block; width: 100%; text-align: left; padding: 8px 12px; border: none;
      background: transparent; color: var(--text); font-size: 13px; border-radius: 7px; cursor: pointer;
    }
    .ctx-menu .ctx-item:hover { background: var(--bg-hover); }
    .ctx-menu .ctx-item.with-icon { display: flex; align-items: center; gap: 7px; }
    .ctx-menu .ctx-item.with-icon .icon { flex: none; }
    .ctx-menu .ctx-item:disabled { color: var(--text-faint); cursor: default; }
    .ctx-menu .ctx-item:disabled:hover { background: transparent; }
    .ctx-menu .ctx-item.danger { color: var(--danger); }
    .ctx-menu .ctx-item.danger:hover { background: var(--danger-soft); }
    .ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 5px 8px; }
    /* 菜单资料头（头像+用户名，可点击） */
    .ctx-menu .ctx-profile {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 12px; border: none; background: transparent; cursor: pointer;
      border-radius: 7px; color: var(--text); font-size: 13px; text-align: left;
    }
    .ctx-menu .ctx-profile:hover { background: var(--bg-hover); }
    .ctx-menu .ctx-profile-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; font-weight: 500; }
    /* 菜单自定义控件区（外观快速开关等） */
    .ctx-menu .ctx-section { padding: 2px 8px 6px; }
    /* 外观分段选择条：滑动高亮指示块；同心圆角（外 8px = 内 5px + 3px 间距） */
    .ctx-theme-switch {
      position: relative;
      display: flex; gap: 3px; padding: 3px;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
    }
    .ctx-theme-thumb {
      position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0;
      background: var(--accent); border-radius: 5px; box-shadow: var(--shadow-sm);
      pointer-events: none;
    }
    .ctx-theme-thumb.anim {
      transition: transform .28s cubic-bezier(.4, 0, .2, 1), width .28s cubic-bezier(.4, 0, .2, 1);
    }
    .ctx-theme-switch button {
      position: relative; z-index: 1;
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 0; border: none; border-radius: 5px;
      background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer;
      transition: color .18s ease;
    }
    .ctx-theme-switch button .icon { margin-right: 0; }
    .ctx-theme-switch button:hover { color: var(--text); }
    .ctx-theme-switch button.active { color: var(--accent-text); font-weight: 500; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="brand">
          <img class="logo" src="assets/logo.svg" alt="" width="28" height="28">
          <span class="brand-text">
            <span class="name">WebSSH</span>
            <span class="sub">TERMINAL</span>
          </span>
        </span>
        <span class="sidebar-header-right">
          <span class="count" id="host-count"></span>
        </span>
      </div>
      <div id="host-list"></div>
      <div class="sidebar-footer">
        <button id="btn-user" title="设置"><span class="user-avatar" id="user-avatar">…</span><span class="user-name" id="user-name">…</span></button>
      </div>
    </aside>
    <main id="main">
      <div id="tabbar"></div>
      <div id="terminals"></div>
      <div id="empty-state">
        <div class="big">⌨</div>
        <div>在左侧选择主机开始连接</div>
      </div>
    </main>
  </div>
  <div id="modal-root"><div class="modal-mask"></div><div class="modal"></div></div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/xterm-addon-fit.js"></script>
  <script src="vendor/qrcodegen.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
