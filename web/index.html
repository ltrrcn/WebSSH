<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebSSH</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #14161a; color: #e6e6e6;
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; background: #1c1f26; border-bottom: 1px solid #2a2e37;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    nav { display: flex; gap: 4px; }
    nav a {
      color: #9aa0aa; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 14px;
    }
    nav a:hover { color: #e6e6e6; background: #262a33; }
    nav a.active { color: #fff; background: #2f6fed; }
    main { padding: 20px; }
    .placeholder { color: #6b7280; font-size: 14px; padding: 40px 0; text-align: center; }
    /* 主机选择 */
    .host-picker { display: flex; flex-wrap: wrap; gap: 24px; }
    .host-group-title { color: #8b929e; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
    .host-item { display: flex; flex-direction: column; gap: 2px; width: 240px; text-align: left;
      background: #1c2027; border: 1px solid #2a2e37; border-radius: 8px; padding: 10px 14px; cursor: pointer; color: #e6e6e6; }
    .host-item:hover { border-color: #2f6fed; }
    .host-name { font-size: 14px; font-weight: 600; }
    .host-meta { font-size: 12px; color: #8b929e; font-family: Menlo, monospace; }
    .host-warn { font-size: 11px; color: #d97706; margin-top: 2px; }
    /* 终端 */
    .term-wrap { display: flex; flex-direction: column; height: calc(100vh - 110px); }
    .term-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 10px; }
    .term-title { font-size: 13px; color: #9aa0aa; font-family: Menlo, monospace; }
    .term-actions button, .host-item { font-size: 12px; }
    .term-actions button { background: #262a33; color: #cdd3dc; border: 1px solid #2a2e37; border-radius: 6px; padding: 4px 10px; margin-left: 6px; cursor: pointer; }
    .term-actions button:hover { background: #303543; }
    #term-container { flex: 1; background: #0d0f12; border-radius: 8px; padding: 8px; min-height: 0; }
    .term-status { min-height: 20px; font-size: 12px; color: #6b7280; padding-top: 6px; }
    .term-status.err { color: #ef4444; }
    /* 主机管理 */
    .hosts-toolbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
    .hosts-toolbar span { color: #8b929e; font-size: 13px; }
    .host-row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #1c2027; border: 1px solid #2a2e37; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
    .host-row-main { display: flex; flex-direction: column; gap: 2px; }
    .host-row-actions { display: flex; gap: 6px; align-items: center; }
    .host-row-actions button { background: #262a33; color: #cdd3dc; border: 1px solid #2a2e37; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    .host-row-actions button:hover { background: #303543; }
    .host-row-actions button.danger { color: #f87171; }
    button.primary { background: #2f6fed !important; color: #fff !important; border-color: #2f6fed !important; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #262a33; color: #8b929e; }
    .tag.ok { color: #34d399; } .tag.warn { color: #fbbf24; }
    .host-form { background: #1c2027; border: 1px solid #2a2e37; border-radius: 10px; padding: 16px 20px; margin-top: 16px; max-width: 480px; }
    .host-form h3 { margin: 0 0 12px; font-size: 14px; }
    .host-form label { display: block; font-size: 12px; color: #9aa0aa; margin-bottom: 10px; }
    .host-form input, .host-form select, .host-form textarea { display: block; width: 100%; margin-top: 4px;
      background: #14161a; color: #e6e6e6; border: 1px solid #2a2e37; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
    .host-form textarea { font-family: Menlo, monospace; font-size: 11px; }
    .form-actions { display: flex; gap: 8px; }
    .form-actions button { background: #262a33; color: #cdd3dc; border: 1px solid #2a2e37; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
    .form-note { font-size: 11px; color: #6b7280; margin: 4px 0 12px; }
  </style>
</head>
<body>
  <header>
    <h1>WebSSH</h1>
    <nav id="nav">
      <a href="#/terminal" data-page="terminal">终端</a>
      <a href="#/hosts" data-page="hosts">主机</a>
      <a href="#/audit" data-page="audit">审计</a>
      <a href="#/tokens" data-page="tokens">令牌</a>
    </nav>
  </header>
  <main id="app"><div class="placeholder">加载中…</div></main>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/xterm-addon-fit.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
