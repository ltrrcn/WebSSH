# Docker 镜像构建与发布（多架构：linux/amd64 + linux/arm64）
# 触发：推送 v* 标签，或 Actions 页面手动 Run workflow
# 发布目标：
#   - ghcr.io/<owner>/webssh（GitHub 容器仓库，用内置 GITHUB_TOKEN，无需配置）
#   - docker.cnb.cool/ltrr/webssh（CNB 制品库，fnos-docker compose 引用源；配置 Secret CNB_REGISTRY_TOKEN 后自动启用）
#   - docker.io/<DOCKERHUB_USERNAME>/webssh（官方 Docker Hub，配置仓库 Secret 后自动启用）
name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CNB 制品库（fnos-docker compose 的镜像源，国内直连）；Secret：CNB_REGISTRY_TOKEN = CNB 访问令牌
      - name: Login to CNB registry
        if: ${{ secrets.CNB_REGISTRY_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: ltrr
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/webssh
            ${{ secrets.CNB_REGISTRY_TOKEN != '' && 'docker.cnb.cool/ltrr/webssh' || '' }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/webssh', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
